    <!-- Early Theme Initialization (Anti-FOUC) -->
    <script>
      (function() {
        try {
          var key = 'zn_theme_preference_v1';
          var pref = localStorage.getItem(key);
          var m = window.matchMedia('(prefers-color-scheme: dark)');
          var isDark = pref === 'dark' || (pref !== 'light' && (!m || m.matches));
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isDark ? '#070B14' : '#F8FAFC');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Critical inline styles for instant first paint -->
    <style>
      html, body { background-color: #070B14; color: #fff; margin: 0; padding: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: #F8FAFC; color: #0A0F1D; }
      #root { min-height: 100vh; }
    </style>

        <h1 style="color: #9fd5b2; margin-top: 0;">Zeitnah LMS — Privacy Policy</h1>
        <p><em>Effective Date: October 16, 2026 | Last Updated: October 16, 2026</em></p>
        <p>This Privacy Policy covers the Zeitnah Learning Management System (LMS) at <a href="https://zeitnahacademy.com" style="color: #9fd5b2;">zeitnahacademy.com</a> and the official Zeitnah iOS mobile app (<code>com.zeitnahacademy.app</code>).</p>
        
        <h2>1. Information We Collect</h2>
        <p>We collect account credentials (name, email, unique username, role), professional profile attributes (department, discipline, skills, work history), learning activity records (courses enrolled, class progress in seconds, attendance, completion streaks, leaderboard points), uploaded content (resumes, projects, messages), and technical diagnostics (device identifier, browser/OS version, IP address, and push notification tokens).</p>
        
        <h2>2. Video Playback & Forensic Watermarking</h2>
        <p>Course lectures are delivered using encrypted DRM streaming (VdoCipher and AWS S3). During playback, a dynamic semi-transparent watermark containing the authenticated viewer's name, email, and device identifier is displayed to deter unauthorized screen-recording and content piracy.</p>

        <h2>3. Third-Party Service Providers</h2>
        <p>We work with trusted infrastructure providers: Amazon Web Services (AWS S3, Mumbai region), VdoCipher (video DRM), Resend (transactional email), Upstash Redis (caching and rate limiting), and Apple APNs (push notifications).</p>

        <h2>4. Account and Data Deletion (Apple Guideline 5.1.1(v))</h2>
        <p>Users have the right to permanently delete their account and associated data at any time. You may request deletion in-app via <strong>Profile &gt; Account &gt; Security</strong> or by emailing our privacy team directly from your registered email address with the subject "Account Deletion Request".</p>

        <h2>5. Operating Entity & Contact Information</h2>
        <p>Legal Entity: <strong>ZEITNAH INSTITUTE OF SURVEY LLP</strong> (Limited Liability Partnership)<br/>
        Address: 1st Floor, 34/1412, Babil Complex, Kovilakam Road, Mankavu, Kozhikode, Kerala 673007, India<br/>
        Operating Platform: Zeitnah LMS (<a href="https://zeitnahacademy.com" style="color: #9fd5b2;">https://zeitnahacademy.com</a>)<br/>
        Support Center: <a href="https://zeitnahacademy.com/support" style="color: #9fd5b2;">https://zeitnahacademy.com/support</a><br/>
        Privacy Inquiries: <a href="mailto:privacy@zeitnahacademy.com" style="color: #9fd5b2;">privacy@zeitnahacademy.com</a></p>
