<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- SEO Meta -->
    <title>Zeitnah — See the unseen</title>
    <meta name="description" content="Zeitnah — See the unseen. Build, connect, discover through knowledge, community, and opportunity." />
    <meta name="theme-color" content="#070B14" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://zeitnahacademy.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zeitnah — See the unseen" />
    <meta property="og:description" content="Build, connect, discover across a global civil community enjoying progress, network, and opportunities through the freedom of knowledge." />
    <meta property="og:site_name" content="Zeitnah" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zeitnah — See the unseen" />
    <meta name="twitter:description" content="Build, connect, discover across a global civil community enjoying progress, network, and opportunities through the freedom of knowledge." />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- JSON-LD Structured Data (Organization & WebSite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://zeitnahacademy.com/#organization",
            "name": "Zeitnah",
            "url": "https://zeitnahacademy.com",
            "logo": "https://zeitnahacademy.com/icons/icon-512.png",
            "slogan": "See the unseen",
            "description": "To build the best global civil community where people can enjoy progress, network, opportunities, and success through the freedom of knowledge."
          },
          {
            "@type": "WebSite",
            "@id": "https://zeitnahacademy.com/#website",
            "url": "https://zeitnahacademy.com",
            "name": "Zeitnah",
            "publisher": { "@id": "https://zeitnahacademy.com/#organization" },
            "description": "Zeitnah — See the unseen. Build, connect, discover through knowledge, community, and opportunity."
          }
        ]
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zeitnah" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Resource Hints -->
    <link rel="dns-prefetch" href="https://zeitnahacademy.com" />
    <link rel="preconnect" href="https://zeitnahacademy.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts — only critical weights, swap display -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
      />
    </noscript>

    <!-- Critical inline styles for instant first paint -->
    <style>
      html, body { background-color: #070B14; color: #fff; margin: 0; padding: 0; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
